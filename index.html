<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>像素画编辑器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: 'Segoe UI', sans-serif; }
h1 { color: #e0e0e0; margin-bottom: 16px; font-size: 20px; }
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; background: #16213e; padding: 10px 16px; border-radius: 8px; flex-wrap: wrap; }
.toolbar label { color: #a0a0a0; font-size: 14px; }
#colorPicker { width: 40px; height: 40px; border: 2px solid #555; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
.btn { padding: 8px 14px; background: #0f3460; color: #e0e0e0; border: 1px solid #555; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn:hover { background: #1a4a80; }
.btn.active { background: #e94560; border-color: #e94560; }
#grid { display: inline-grid; gap: 0; border: 2px solid #333; }
.cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: rgba(0,0,0,0.7); font-weight: bold; text-shadow: 0 0 2px rgba(255,255,255,0.5); cursor: pointer; transition: opacity 0.1s; }
.cell.show-grid { border: 1px solid rgba(0,0,0,0.25); }
.cell:hover { opacity: 0.75; outline: 2px solid #e94560; z-index: 1; position: relative; }
#info { color: #888; font-size: 13px; margin-top: 12px; }
#tooltip { position: fixed; background: #16213e; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 13px; pointer-events: none; z-index: 999; display: none; border: 1px solid #555; white-space: nowrap; }
#tooltip .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 6px; border: 1px solid #555; }
#beadPanel { display: flex; flex-wrap: wrap; gap: 4px; max-height: 150px; overflow-y: auto; padding: 8px; background: #16213e; border-radius: 8px; margin-bottom: 12px; }
.bead-item { display: flex; align-items: center; gap: 3px; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; color: #ccc; }
.bead-item:hover { background: #0f3460; }
.bead-swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #555; }
</style>
</head>
<body>
<h1>🎨 像素画编辑器</h1>
<div class="toolbar">
  <label>画笔颜色</label>
  <input type="color" id="colorPicker" value="#ffffff">
  <button class="btn" id="eyedropper" title="吸管工具">💉 吸管</button>
  <button class="btn active" id="gridToggle" title="显示/隐藏网格">▦ 网格</button>
  <button class="btn" id="exportNoGrid" title="导出纯色块（无网格）">💾 导出PNG</button>
  <button class="btn" id="exportWithGrid" title="导出带网格">💾 导出PNG(网格)</button>
  <button class="btn" id="clearBtn" title="清空画布">🗑️ 清空</button>
</div>
<div id="tooltip"></div>
<div id="beadPanel"></div>
<div id="grid"></div>
<div id="info">左键按住拖动批量填色 | 右键吸管取色 | 自动保存，刷新不丢</div>

function findClosestBeadColor(rgb) {
  const m = rgb.match(/\d+/g);
  if (!m) return null;
  const r = +m[0], g = +m[1], b = +m[2];
  let minDist = Infinity, best = null;
  for (const [bh, code, name] of BEAD_COLORS) {
    const bm = bh.match(/[0-9a-f]{2}/gi);
    const br = parseInt(bm[0],16), bg = parseInt(bm[1],16), bb = parseInt(bm[2],16);
    const dist = (r-br)**2 + (g-bg)**2 + (b-bb)**2;
    if (dist < minDist) { minDist = dist; best = {hex:bh, code, name, dist}; }
  }
  return best;
}

function initBeadPanel() {
  const panel = document.getElementById('beadPanel');
  for (const [hex, code, name] of BEAD_COLORS) {
    const item = document.createElement('div');
    item.className = 'bead-item';
    item.innerHTML = '<span class="bead-swatch" style="background:'+hex+'"></span>'+code;
    item.title = name + ' (' + hex + ')';
    item.addEventListener('click', () => {
      document.getElementById('colorPicker').value = hex;
    });
    panel.appendChild(item);
  }
}

const BLOCK = 40;
const STORAGE_KEY = 'pixel_editor_data';
let eyedropperMode = false;
let showGrid = true;
let gridEl, rows, cols;

function saveState() {
  const cells = gridEl.querySelectorAll('.cell');
  const data = [];
  for (let r = 0; r < rows; r++) {
    data[r] = [];
    for (let c = 0; c < cols; c++) {
      data[r][c] = cells[r * cols + c].style.backgroundColor;
    }
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) return JSON.parse(saved);
  return null;
}

function init() {
  gridEl = document.getElementById('grid');
  const saved = loadState();
  const initial = saved || GRID_DATA;
  rows = initial.length;
  cols = initial[0].length;

  gridEl.style.gridTemplateColumns = `repeat(${cols}, ${BLOCK}px)`;
  gridEl.style.gridTemplateRows = `repeat(${rows}, ${BLOCK}px)`;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (showGrid ? ' show-grid' : '');
      cell.dataset.r = r;
      cell.dataset.c = c;
      const color = saved ? initial[r][c] : `rgb(${initial[r][c].join(',')})`;
      cell.style.backgroundColor = color;
      gridEl.appendChild(cell);
    }
  }

  let painting = false;
  function paintCell(e) {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    if (eyedropperMode) {
      document.getElementById('colorPicker').value = rgbToHex(cell.style.backgroundColor);
      eyedropperMode = false;
      document.getElementById('eyedropper').classList.remove('active');
    } else {
      cell.style.backgroundColor = document.getElementById('colorPicker').value;
      saveState();
    }
  }
  gridEl.addEventListener('mousedown', e => {
    if (e.button === 0) { painting = true; paintCell(e); }
  });
  gridEl.addEventListener('mousemove', e => { if (painting) paintCell(e); });
  document.addEventListener('mouseup', e => { if (e.button === 0) painting = false; });
  gridEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const cell = e.target.closest('.cell');
    if (cell) document.getElementById('colorPicker').value = rgbToHex(cell.style.backgroundColor);
  });

  document.getElementById('eyedropper').addEventListener('click', function() {
    eyedropperMode = !eyedropperMode;
    this.classList.toggle('active', eyedropperMode);
  });

  document.getElementById('gridToggle').addEventListener('click', function() {
    showGrid = !showGrid;
    this.classList.toggle('active', showGrid);
    gridEl.querySelectorAll('.cell').forEach(c => c.classList.toggle('show-grid', showGrid));
  });

  function exportPNG(withGrid) {
    const canvas = document.createElement('canvas');
    canvas.width = cols * BLOCK;
    canvas.height = rows * BLOCK;
    const ctx = canvas.getContext('2d');
    const cells = gridEl.querySelectorAll('.cell');
    cells.forEach(cell => {
      const r = +cell.dataset.r, c = +cell.dataset.c;
      ctx.fillStyle = cell.style.backgroundColor;
      ctx.fillRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);
    });
    if (withGrid) {
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1;
      for (let r = 0; r <= rows; r++) {
        ctx.beginPath(); ctx.moveTo(0, r * BLOCK); ctx.lineTo(cols * BLOCK, r * BLOCK); ctx.stroke();
      }
      for (let c = 0; c <= cols; c++) {
        ctx.beginPath(); ctx.moveTo(c * BLOCK, 0); ctx.lineTo(c * BLOCK, rows * BLOCK); ctx.stroke();
      }
    }
    const a = document.createElement('a');
    a.download = withGrid ? 'pixel_art_grid.png' : 'pixel_art.png';
    a.href = canvas.toDataURL();
    a.click();
  }

  document.getElementById('exportNoGrid').addEventListener('click', () => exportPNG(false));
  document.getElementById('exportWithGrid').addEventListener('click', () => exportPNG(true));

  // Tooltip on hover
  const tooltip = document.getElementById('tooltip');
  gridEl.addEventListener('mousemove', e => {
    const cell = e.target.closest('.cell');
    if (!cell) { tooltip.style.display = 'none'; return; }
    const bead = findClosestBeadColor(cell.style.backgroundColor);
    if (bead) {
      tooltip.innerHTML = '<span class="swatch" style="background:'+bead.hex+'"></span>'+bead.code+' '+bead.name+' ('+bead.hex+')';
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    }
  });
  gridEl.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (confirm('确定要清空画布吗？')) {
      gridEl.querySelectorAll('.cell').forEach(c => c.style.backgroundColor = '#ffffff');
      saveState();
    }
  });
}

function rgbToHex(rgb) {
  const m = rgb.match(/\d+/g);
  if (!m) return '#000000';
  return '#' + m.slice(0,3).map(x => (+x).toString(16).padStart(2,'0')).join('');
}

initBeadPanel();
init();
</script>
